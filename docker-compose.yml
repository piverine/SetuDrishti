version: '3.8'

services:
  backend:
    build:
      context: ./setu_drishti_backend
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    # You can pass environment variables here
    # env_file:
    #   - ./setu_drishti_backend/.env
    restart: always

  simulator:
    build:
      context: ./setu_drishti_backend
    command: ["python", "simulator.py"]
    depends_on:
      - backend
    restart: always

  frontend:
    build:
      context: ./setu_drishti_web
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: always
